<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Couscous OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar">
    <span class="title">Couscous OS</span>
    <span id="clock-display">00:00</span>
  </div>

  <div id="desktop-area">
    
    <div class="app-window" id="win-terminal">
      <div class="win-header" id="win-terminal-bar">
        <span>Terminal.exe</span>
        <button onclick="closeWin('win-terminal')">X</button>
      </div>
      <div class="win-content">
        <div id="term-logs">
          <p>terminal</p>
          <p>Type 'help' for commands</p>
        </div>
        <div class="input-line">
          <span>></span>
          <input type="text" id="cmd-input">
        </div>
      </div>
    </div>

    <div class="app-window" id="win-notes" style="left: 360px;">
      <div class="win-header" id="win-notes-bar">
        <span>About</span>
        <button onclick="closeWin('win-notes')">X</button>
      </div>
      <div class="win-content">
        <h3>Couscous OS</h3>
        <p>A basic desktop environment built with HTML,CSS and JS.</p>
        <p>Try dragging the top headers or typing into the terminal</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
