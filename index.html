<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Couscous OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar">
    <span class="title">Couscous OS</span>
    <span id="clock-display">00:00</span>
  </div>

  <div id="desktop-area">
  
    <div class="app-window" id="win-terminal">
      <div class="win-header" id="win-terminal-bar">
        <span>Terminal.exe</span>
        <button onclick="closeWin('win-terminal')">X</button>
      </div>
      <div class="win-content">
        <div id="term-logs">
          <p>Terminal</p>
          <p>Type 'help' for cmd.</p>
        </div>
        <div class="input-line">
          <span>></span>
          <input type="text" id="cmd-input">
        </div>
      </div>
    </div>

    <div class="app-window" id="win-notes" style="left: 380px;">
      <div class="win-header" id="win-notes-bar">
        <span>System Log</span>
        <button onclick="closeWin('win-notes')">X</button>
      </div>
      <div class="win-content">
        <h3>Couscous OS</h3>
        <p><b>Kernel:</b> JavaScript (DOM Event Engine)</p>
        <p><b>Memory:</b> Browser Session Storage</p>
        <p><b>Recent Changes:</b></p>
        <ul style="padding-left: 18px; margin-top: 4px;">
          <li>Added custom mouse drag listeners</li>
          <li>Built interactive command terminal</li>
          <li>Fixed window closing mechanics</li>
        </ul>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
